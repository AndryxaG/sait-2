<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Складской учет</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f5f7);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111827);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --btn: var(--tg-theme-button-color, #007aff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(0, 0, 0, 0.08);
      --success: #34c759;
      --danger: #ff3b30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; }

    /* Поиск и шапка */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg); padding: 12px 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 1px 0 var(--border);
    }
    .search-row { display: flex; gap: 8px; align-items: center; }
    .search-input-wrap {
      position: relative; flex: 1; display: flex; align-items: center;
    }
    .search-input {
      width: 100%; height: 42px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text); padding: 0 12px 0 36px; font-size: 15px; outline: none;
    }
    .search-icon { position: absolute; left: 12px; font-size: 14px; opacity: 0.5; }
    .btn-camera {
      width: 42px; height: 42px; border-radius: 12px;
      background: var(--btn); color: var(--btn-text);
      border: none; display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer;
    }

    /* Теги OCR */
    .ocr-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px 0; }
    .chip {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 12px; font-size: 13px;
      white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }

    /* Карточки */
    .container { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card-bg); border-radius: 16px;
      padding: 14px; border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      display: flex; flex-direction: column; gap: 10px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title { font-size: 16px; font-weight: 600; line-height: 1.3; }
    .badge {
      font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px;
      background: rgba(52, 199, 89, 0.15); color: var(--success); white-space: nowrap;
    }
    .badge.empty { background: rgba(255, 59, 48, 0.15); color: var(--danger); }

    .card-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--hint); }
    .meta-tag { background: var(--bg); padding: 3px 8px; border-radius: 6px; }

    .card-photos { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
    .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }

    .btn-action {
      background: var(--btn); color: var(--btn-text);
      border: none; border-radius: 10px; height: 38px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    /* Модалка списания */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4);
      display: none; align-items: flex-end; z-index: 1000;
    }
    .modal-sheet {
      background: var(--card-bg); width: 100%; border-radius: 20px 20px 0 0;
      padding: 20px 16px; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
    }
    .quick-amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn-quick {
      height: 42px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-weight: 600; font-size: 15px;
      cursor: pointer;
    }
    .custom-input {
      width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 16px; text-align: center;
      outline: none;
    }

    .loader { text-align: center; color: var(--hint); padding: 40px 0; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="search-row">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по артикулу, названию..." />
      </div>
      <button class="btn-camera" onclick="triggerCamera()">📷</button>
      <input type="file" id="fileInput" accept="image/*" style="display: none" onchange="handleFileUpload(event)" />
    </div>
    <div id="ocrChips" class="ocr-chips" style="display: none;"></div>
  </div>

  <div id="container" class="container">
    <div class="loader">⏳ Загружаю остатки оборудования...</div>
  </div>

  <!-- Модальное окно списания -->
  <div id="modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <h3 id="modalTitle">Списание товара</h3>
      <div style="font-size: 14px; color: var(--hint);" id="modalStock">Доступно: 0 шт.</div>

      <div class="quick-amounts">
        <button class="btn-quick" onclick="setDeductAmount(1)">-1 шт.</button>
        <button class="btn-quick" onclick="setDeductAmount(2)">-2 шт.</button>
        <button class="btn-quick" onclick="setDeductAmount(5)">-5 шт.</button>
      </div>

      <input type="number" id="customAmount" class="custom-input" placeholder="Или введите количество" value="1" min="1" />

      <button class="btn-action" style="background: var(--danger);" onclick="confirmDeduction()">
        📉 Подтвердить списание
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentItems = [];
    let activeItem = null;

    async function loadItems(query = "") {
      const container = document.getElementById("container");
      container.innerHTML = '<div class="loader">🔍 Поиск в базе...</div>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        currentItems = data.items || [];
        renderCards();
      } catch (err) {
        container.innerHTML = '<div class="loader">❌ Ошибка подключения к серверу</div>';
      }
    }

    function renderCards() {
      const container = document.getElementById("container");
      if (!currentItems.length) {
        container.innerHTML = '<div class="loader">Ничего не найдено</div>';
        return;
      }

      container.innerHTML = currentItems.map(item => `
        <div class="card">
          <div class="card-top">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="badge ${item.quantity <= 0 ? 'empty' : ''}">${item.quantity} шт.</div>
          </div>
          <div class="card-meta">
            <span class="meta-tag">📁 ${escapeHtml(item.category)}</span>
            <span class="meta-tag">🏢 ${escapeHtml(item.sklad)}</span>
            <span class="meta-tag">📍 ${escapeHtml(item.mesto)}</span>
          </div>
          ${item.photos.length ? `
            <div class="card-photos">
              ${item.photos.map(p => `
                <img class="thumb" src="/api/photo?block_id=${p.block_id}&oss_name=${encodeURIComponent(p.oss_name)}&file_name=${encodeURIComponent(p.file_name)}" onclick="openFullImage(this.src)" />
              `).join('')}
            </div>
          ` : ''}
          <button class="btn-action" onclick="openDeductModal('${item.id}')">
            📦 Списать со склада
          </button>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // Живой поиск с задержкой (debounce)
    let searchTimeout = null;
    document.getElementById("searchInput").addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => loadItems(e.target.value), 400);
    });

    // Фото / Камера OCR
    function triggerCamera() {
      document.getElementById("fileInput").click();
    }

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const chipsBox = document.getElementById("ocrChips");
      chipsBox.style.display = "flex";
      chipsBox.innerHTML = '<span class="chip">🧠 Нейросеть распознает маркировку...</span>';

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("/api/ocr", { method: "POST", body: formData });
        const data = await res.json();
        const vars = data.variants || [];

        if (!vars.length) {
          chipsBox.innerHTML = '<span class="chip">❌ Текст не распознан</span>';
          return;
        }

        chipsBox.innerHTML = vars.map(v => `
          <div class="chip" onclick="applyOcrChip('${escapeHtml(v)}')">🔍 ${escapeHtml(v)}</div>
        `).join('');
      } catch (err) {
        chipsBox.innerHTML = '<span class="chip">⚠️ Ошибка анализа</span>';
      }
    }

    function applyOcrChip(text) {
      document.getElementById("searchInput").value = text;
      loadItems(text);
    }

    // Модальное окно списания
    function openDeductModal(itemId) {
      activeItem = currentItems.find(x => x.id === itemId);
      if (!activeItem) return;

      document.getElementById("modalTitle").textContent = activeItem.title;
      document.getElementById("modalStock").textContent = `Доступно: ${activeItem.quantity} шт.`;
      document.getElementById("customAmount").value = 1;
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal(e) {
      document.getElementById("modal").style.display = "none";
    }

    function setDeductAmount(num) {
      document.getElementById("customAmount").value = num;
    }

    async function confirmDeduction() {
      const amount = parseInt(document.getElementById("customAmount").value);
      if (!amount || amount <= 0 || amount > activeItem.quantity) {
        alert("Некорректное количество!");
        return;
      }

      try {
        const res = await fetch("/api/deduct", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            page_id: activeItem.id,
            col_name: activeItem.kolvo_col_name,
            prop_type: activeItem.kolvo_prop_type,
            current_qty: activeItem.quantity,
            amount: amount
          })
        });

        if (res.ok) {
          const data = await res.json();
          activeItem.quantity = data.new_qty;
          renderCards();
          closeModal();
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } else {
          alert("Ошибка при обновлении данных в Buildin");
        }
      } catch (err) {
        alert("Сетевая ошибка");
      }
    }

    loadItems();
  </script>
</body>
</html>
